  <path d="M 330 110 A 38 38 0 1 1 292 72 A 32 32 0 1 0 330 110 Z" fill="url(#gold)" />
  <polygon points="340,78 343,87 352,87 345,92 348,100 340,95 332,100 335,92 328,87 337,87" fill="url(#gold)" />

  <!-- Rehal / Book Stand Base -->
  <path d="M 170 360 L 256 310 L 342 360 L 320 376 L 256 338 L 192 376 Z" fill="url(#gold)" />
  
