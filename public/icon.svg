  <!-- Title Banner -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" text-anchor="middle" fill="#ffffff" letter-spacing="3">STUDENTS REGISTER</text>
  <text x="256" y="452" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle" fill="url(#gold)" letter-spacing="2">ALBAKSH MOLSAB</text>
