  <line x1="130" y1="215" x2="230" y2="205" stroke="#059669" stroke-width="5" stroke-linecap="round" />
  <line x1="130" y1="240" x2="230" y2="230" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <line x1="130" y1="265" x2="230" y2="255" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <line x1="130" y1="290" x2="210" y2="280" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <line x1="282" y1="205" x2="382" y2="215" stroke="#059669" stroke-width="5" stroke-linecap="round" />
  <line x1="282" y1="230" x2="382" y2="240" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <line x1="282" y1="255" x2="382" y2="265" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <line x1="302" y1="280" x2="382" y2="290" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Bookmark Ribbon -->
